  <style>
    html, body { margin: 0; height: 100%; background: #f3f7f4; }

            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f2a1f; gap: 18px; }

    @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }

  <div id="boot" role="status" aria-live="polite">

      var b = document.getElementById('boot'); if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
